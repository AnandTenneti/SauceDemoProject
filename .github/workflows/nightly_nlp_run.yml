name: Nightly NLP Runner

on:
  schedule:
    # 2:00 AM UTC = 7:30 AM IST. Adjust to taste.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "NLP command to run"
        required: false
        default: "run smoke and regression tests on chrome with allure report"

jobs:
  nlp-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Allure commandline
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          curl -o allure.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          sudo tar -zxvf allure.tgz -C /opt/
          sudo ln -s /opt/allure-2.29.0/bin/allure /usr/local/bin/allure

      - name: Run NLP runner
        env:
          CI: "true"
        run: >
          python nlp_runner.py --no-open
          --command "${{ github.event.inputs.command || 'run smoke and regression tests on chrome with allure report' }}"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14
