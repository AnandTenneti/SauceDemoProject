# SonarCloud project configuration
# Docs: https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-parameters/

sonar.projectKey=AnandTenneti_SauceDemoProject
sonar.organization=anandtenneti

# Human-readable name shown in the SonarCloud dashboard
sonar.projectName=SauceDemoProject

# Source and test locations — adjust these two lines if your layout differs
sonar.sources=agents,config,pages,runners,utils,nlp_runner.py
sonar.tests=tests

# Exclude generated/vendor content from analysis
sonar.exclusions=**/venv/**,**/__pycache__/**,**/allure-results/**,**/allure-report/**,**/.github/**

# Python coverage report produced by pytest-cov (see workflow step below)
sonar.python.coverage.reportPaths=coverage.xml

# Optional: point Sonar at pytest's own JUnit-style output if you enable it
sonar.python.xunit.reportPath=test-results.xml

sonar.sourceEncoding=UTF-8